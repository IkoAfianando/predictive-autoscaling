          envFrom:
            - configMapRef: { name: app-common-config }
          env:
            - name: SERVICE_NAME
              value: "order"
            - name: STACK_NAME
              value: "java"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-credentials, key: password }
            - name: DB_USER

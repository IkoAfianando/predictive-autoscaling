              value: "postgres://$(DB_USER):$(DB_PASSWORD)@postgres:5432/java_db"
            - name: USER_SERVICE_URL
              value: "http://java-user:8080"
            - name: PRODUCT_SERVICE_URL
              value: "http://java-product:8080"

# =============================================================
# Reactive HPAs (autoscaling/v2, CPU 60%) — one per service.
# This is the REACTIVE baseline; the predictive controller
# (../../controller) is evaluated against these.
# =============================================================
---
# Reactive CPU HPA for go-user — the BASELINE autoscaler to compare the
# ML-based predictive controller against.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: go-user
  namespace: pas-thesis
  labels:
    app: go-user
    autoscaler: reactive-baseline
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: go-user
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
---
